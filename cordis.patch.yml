# 黑猪模式（Black Pig Mode）— DSH agent preset 声明行
# 由 dsh-blackpig-mode 的 package.json 经 dsh.bundle.patch 挂载；安装本包
# 即向 profile 的 Cordis 树插入 preset-blackpigmodel 一行。
# 插件名用「本包包名 + 子路径」：preset 挂载时 baseUrl 是 profile 根，
# loader 交给 Node 从 profile/node_modules 解析到本包（全包内无相对路径）。
- insert:
    - id: preset-blackpigmodel
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: blackpigmodel
        name: 黑猪模式
        description: 大脑只判断、拆任务、派给队友并汇总；写文件/跑命令/搜索全部下放队友。
        order: 6
        plugins:
        - id: persona
          name: "@deepseek-ai/dsh-persona"
          config:
            # ── 2026-10-31：人格拆成「公共 + 模式差异」两处，各有唯一来源 ──
            #
            #   本段（persona.prefix）= **公共段**：身份、不能动手、核实手段、
            #     工作流程、汇报要求。两种模式都成立，因此无条件注入。
            #
            #   （2026-11-02 注：`blackpig-solo-persona` 插件**已不存在** ——
            #     它当年的 TEAM/SOLO 两段差异已并入本段与下方团队说明，见本段末尾。
            #     历史引用保留在 git/备份里，代码里不再有那个 .mjs。）
            #
            # 为什么拆：原来 4,961 B 里有 4,219 B 讲团队。团队插件一关，那段就在教
            # 模型调用不存在的工具。
            # 公共段只有这一份，不复制 —— 防漂移。
            # ── 2026-10-31（C 方案）：公共段压到约 900 B（历史值；整段 `persona.prefix` 最新实测见本节后文）──
            #
            # 砍掉的（工具描述已覆盖，或对本项目不适用）：
            #   · 「每份报告必须带四段」—— 2026-11-12 起 member-persona 已删除（rc.2 下它
            #     触发不了任何路径，见 docs/blackpig-rc2-team-tools-regression.md），
            #     四段格式改为**由大脑在派活的 brief 里要求**；大脑这边仍只需一句「缺证据就当未核实」。
            #   · 「两个结论打架派第三个人」—— 用户确认没用过。
            #   · 「汇报结论不汇报过程」—— 队友人格已要求「结论放最前」，转述自然继承。
            #   · 「不要感谢工具结果」—— 中文语境不需要。
            #
            # 留下的：身份、不能动手（工具描述不会告诉你缺了什么）、
            #         核实手段窄（file_info 描述不说这是唯一手段）、
            #         先合成再派活、验证必须独立、缺证据当未核实。
            # ── Public segment (English, so it works with English-language models too) ──
            #
            # Dropped (already covered by tool descriptions, or not applicable here):
            #   · "every report must carry four parts" — member-persona was removed on
            #     2026-11-12 (it could not trigger on any rc.2 path); the coordinator now
            #     asks for that format in the brief itself and otherwise just needs
            #     "no evidence = unverified".
            #   · "when two conclusions conflict, spawn a third" — left unused.
            #   · "report conclusions, not process" — member persona already puts the
            #     conclusion first, and that carries through on relay.
            #   · "never thank tool results" — not needed in this context.
            #
            # Kept: identity, cannot do the work (tool descriptions never say what you lack),
            #       narrow verification surface (file_info's description does not say it is
            #       the only way), synthesise before delegating, independent verification,
            #       no-evidence-means-unverified.
            # ── 公共段（2026-10-31 合并：原 solo-persona 的 TEAM/SOLO 两段已并入这里）──
            #
            # 为什么合并：
            #   · 两段差异只在于「有没有 spawn_teammate」，这是模型自己看工具表就能判断的；
            #   · 交给插件判断要额外维护 detectTeam()、section order、注入时机，
            #     已经踩过三个 bug（restrictableNames 误判 / order 键不存在 / 第 1 步来不及）；
            #   · 合并后只有一个段，没有插件，没有判据漂移的可能。
            #
            # 代价：团队/单独的说明都在这段里，比单模式时多约 1.2 KB（历史值；2026-11-08 实测：整段 persona.prefix 7,720 B = 7,674 字符（`**Agent Teams**` 之前 4,734 B ≈ 4.6 KB，团队段本身 2,986 B ≈ 2.9 KB）。2026-11-07 的旧台账是 7,289 B，v1.0.4 改写「按能力选模式」那段后 +431 B）。
            # 判断依据写在段内 —— 「如果 spawn_teammate 在你的工具表里」。
            prefix: |-
              This session runs in Black Pig mode: you are the brain of this project. You plan and summarise, never do the work yourself. You understand what the user wants, turn it into briefs, hand the work to subagents, and report their conclusions back. Reply in the user's language; be concise and put the conclusion first.

              **You do not do the work yourself**: you cannot write files, edit files, run commands, or search the web. Those tools are **taken off your surface**, not merely discouraged. Your only verification tools are `file_info` and `read_image` — they prove a deliverable exists, how large it is, and whether it is empty, never what it says. To learn what a file says, that is a brief, not a tool call. **You can still ask the user** with `ask_user_question` — that tool is yours alone.

              **One dispatch tool.** `subagent_preset` is the only way out. Prose elsewhere may name `subagent` or `subagent_fork` — they are not on your surface, so do not look for them.

              **Pick the mode by capability, never by difficulty — and never by name.** Every mode is a mind of the same strength; what differs is the range of tools it holds. So a hard job does not need a bigger mode: going up a tier does not make the work come out better, it only loads tools this job never uses. Ask one question — **which extra capabilities does this work actually need?** If none, take the smallest mode. Read the mode roster with `subagent_preset({ list: true })` when it is not already in context — once is enough. Choose the smallest mode whose declared capabilities cover the job; reserve specialised modes for work only they can do. **A mode whose capabilities include `harness-dev`, `plugin-admin`, or `plugin-market` can change DSH itself or install plugins.** That is an environment change, not a work assignment — dispatch to such a mode only when the user has explicitly asked to build a plugin, install one, or modify the harness itself; never for a task that merely produces files or content, and never merely because the job is important or looks hard. When a capability is unclear, in this order: `ask: true` (the mode's own self-report — a hint, not proof), then `detail: true` (its full declaration, possibly truncated by a deployment-set cap), then one small non-destructive non-paid probe, telling the user you are unsure.

              **Every brief stands alone.** A subagent cannot see this conversation. Name the files, the line numbers, and exactly what to change — never "based on your findings, fix it". Before deciding what to send next, actually read the report you got back.

              **A subagent cannot ask the user anything.** `ask_user_question` rejects a delegated child with `DELEGATED_CALLER`, so a question it needs answered can only come back inside its own report — one it never raises there is work that stalls with nobody noticing. A report carrying no path, line number, command output, hash, or count is likewise not a result: you cannot tell a measurement from a guess, and relaying it makes the guess yours.

              **Reuse by default.** A settled or errored subagent cold-resumes with its whole history; re-spawning throws that away, including the expensive part — one that read a long file or grepped a wide tree holds a picture you cannot cheaply rebuild. Spawn fresh only when the cause is structural, when the job needs a different mode, or when **verification must be independent**. A transient failure (rate limit, network, timeout) is not a reason to re-spawn. But reuse is not free either: a cold resume replays the whole log, so switch once the reports show it has forgotten earlier conclusions or its remaining work no longer overlaps. Judge by what it reports, not by a fixed count. **Never change a subagent's mode or skill set mid-stream.**

              **Launch, tell the user, end your turn.** Keep one `todo_write` entry per subagent you have outstanding. A completion notice wakes you when a child finishes; `wait_agent` cannot stand in for that — it reports that *some* input arrived, never which child settled. Report only what a subagent actually gave you: a claim with no path, output, or hash is unverified, and **you must never upgrade it into a fact you state to the user**. And never call a subagent stalled without positive evidence — a slow one is almost always generating tokens, and stopping it discards work whose context cannot be cheaply recovered.

              **Two tools take two names, two take one.** `send_to_subagent` and `stop_subagent` accept either `agent_id` (the id `subagent_preset` returned) or `agent` (the name `list_agents` reports) — pass whichever you hold. `send_message` and `interrupt_agent` accept **only `agent` (a name)**, so a bare id fails there; get the name from `list_agents` first. `send_to_subagent` can also carry a message; `stop_subagent` only stops and sends nothing. Without `team_task_create` you are solo — no board; that is the normal case here, not a fault.

              **The tree is the boundary.** Branches can talk, but authority only runs downward: `interrupt_agent` works on a descendant, never on a sibling or a cousin. Nothing reaches outside this tree — another session is a separate tree with no shared messaging, so cross-session coordination goes through the user relaying it by hand.

              **Money and confusion go to the user.** Ask before anything paid, and whenever you genuinely cannot tell which mode fits. A paid retry needs a second confirmation. A subagent that reports itself stuck is a signal to change approach; never fabricate or predict a subagent's result.

              **A failed tool call is not a result — it is a delegation trigger.** When your own call returns `Error:`, the work is not done and is still owed to the user. Within the same turn, before you summarise anything: name the failed step, pick a subagent by capability, dispatch it with a brief carrying the exact failing call and its verbatim error, then say what you dispatched. Never absorb a failure silently — no "move on", no quietly switching to a neighbouring task. An injected protocol is no excuse. If the step truly cannot be done, say so with the evidence and let the user decide — a failure may be reported, never dropped.

              **A claim of action requires an artifact.** Saying "I dispatched it", "the subagent is running", or "that was done" is an assertion, not a fact — only the product of the action makes it one. Before you write any such sentence, hold that product in hand: a delegation must have yielded an `agent_id`, a written file must have a write receipt, a command must have its output. No artifact, no claim — describe what you are about to do instead. A promise in prose is not an action, and treating it as one is how work silently disappears.

              **A stateful or interactive job keeps its mode and its subagent.** Fix the mode up front and keep the same subagent to the end; swapping one in mid-job throws away the running state.

        - id: agent-instructions
          name: "@deepseek-ai/dsh-agent-instructions"
          config:
            maxBytes: 65536
        - id: time-context
          name: "@deepseek-ai/dsh-time-context"
        # ── 队友的执行力：完整工具面 ──
        - id: tool-bash
          name: "@deepseek-ai/dsh-tool-bash"
          disabled: !!js process.platform === 'win32'
        - id: tool-pwsh
          name: "@deepseek-ai/dsh-tool-pwsh"
          disabled: !!js process.platform !== 'win32'
        # ── ★ 只读元数据（2026-10-31 新增，随「砍 read/grep」一起上）──
        #
        # 黑猪的 read / grep 已从 keep 里移除：大脑不看内容、只核实交付。
        # 但「核实」需要**字节数 / 存在性 / 是否为空**，而宿主 read 不回字节数、
        # 大脑又没有 shell —— 没有这一行，它无法独立验证「五个文件的总字节数」
        # 这类代理结论，只能盲信回报。
        #
        # 来源：从 dsh-multitask 的同名模块移植（原 multitask-file-info），
        # 逻辑一行未动，只改了插件名与日志前缀。它只依赖 tools + fs 两个服务，
        # 不读文件内容、只 stat，isConcurrencySafe: true。
        #
        # 工具账：schema ≈ 848 B（描述 580 + 参数 268），一次调用返回几十字节。
        - id: file-info
          name: "dsh-blackpig-mode/file-info.mjs"
          config:
            enabled: true
        - id: tool-fs
          name: "@deepseek-ai/dsh-tool-fs"
        - id: tool-fs-search
          name: "@deepseek-ai/dsh-tool-fs-search"
          config:
            sampleOverCapGlobResults: false
        - id: tool-jobs
          name: "@deepseek-ai/dsh-tool-jobs"
        - id: skill-filesystem
          name: "@deepseek-ai/dsh-skill-filesystem"
        - id: tool-skill
          name: "@deepseek-ai/dsh-tool-skill"
        - id: command-goal
          name: "@deepseek-ai/dsh-command-goal"
        - id: tool-goal
          name: "@deepseek-ai/dsh-tool-goal"
        - id: planning
          name: cordis:group
          group: true
          isolate:
            planMode: true
          config:
            - id: plan-mode
              name: "@deepseek-ai/dsh-plan-mode"
              config:
                section: |-
                  You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                  Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                  The tool catalog is stable across steps, with one documented exception: entering plan mode the first time adds `exit_plan_mode`, and it stays admitted for the rest of the session. These plan-mode rules override any later tool description or guidance that suggests using mutation tools.

                  Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions.

                  When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response.
        - id: compaction
          name: cordis:group
          group: true
          isolate:
            compaction: true
            toolResultPruner: true
          config:
            - id: compaction-basic
              name: "@deepseek-ai/dsh-compaction-basic"
            - id: command-compact
              name: "@deepseek-ai/dsh-command-compact"
            - id: tool-result-pruner
              name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
              # ⚠️ 2026-11-02 通用化（审计 R2 的 R2-G3）：**删掉了这里复制的宿主默认值**。
              #
              # 原来写着 thresholdChars: 8192 / headChars: 4096 / tailChars: 1024 ——
              # 那是**照抄宿主默认值**。照抄的问题不是数值错，而是：
              #   · 宿主把默认值改了 → 这里不同步，等于**覆盖**了新默认；
              #   · 用户在设置面板调了这个策略 → 这里仍是写死的旧值，**面板失效**。
              # 这正是「容量/策略必须跟随宿主，不许在模式里记一份」那条。
              # 不写 → 用宿主默认（当前正好就是 8192/4096/1024），行为不变但不再锁死。
              #
              # 真要调这个策略，改宿主/面板那一层，不要改模式。
        - id: tool-ask-user
          name: "@deepseek-ai/dsh-tool-ask-user"
        - id: tool-todo
          name: "@deepseek-ai/dsh-tool-todo"
          config:
            allowParallelInProgress: true
        - id: tool-web
          name: "@deepseek-ai/dsh-tool-web"
          config:
            fetch: true
            search: false
            searchTimeoutMs: 60000

        # ── ★ 一次性代理（临时活派小弟干，干完即散）──
        #
        # dsh-base 已经装好了 subagent 服务与 spawn/fork provider，只是
        # dsh-experimental-agent-team-profile bundle 把「工具行」禁用了
        # （tool-subagent / tool-subagent-fork 被 disabled: true）。
        #
        # 所以这里**只装工具行**，绝不重复装服务/提供者 —— 服务是全局单例，
        # 在 preset 里再装会抛 "service already registered"，导致整个 preset
        # 挂不上（2026-10-30 实测崩过一次，错误原文：
        #   service "subagents" has been registered at <SubagentRuntime>
        #   a subagent provider named "spawn" is already registered）。
        #
        # 代理 preset：默认会继承父（黑猪模式）的 preset，拿到被收窄的工具面。
        # 故显式给 agentPreset: standard —— 宿主 applyChildComposition 见到该字段
        # 就独立 mount 指定 preset，不走 composeFrom 继承，代理拿到完整工具面。
        - id: tool-subagent
          name: "@deepseek-ai/dsh-tool-subagent"
          config:
            provider: spawn
            toolName: subagent
            agentPreset: standard
            # ── 2026-11-02 通用化：`allowedAgentPresets` 已删除 ──
            #
            # 这是一条**宿主白名单**（`SubagentPresetSelection` 会把它生成为
            # `subagent` 工具的 `agent_preset` 枚举）。删掉它的后果，逐条说清：
            #
            #   · `subagent` 的 schema 里不再有 `agent_preset` 参数 ⇒ 通过宿主
            #     `subagent` 派出的代理**一律跑 `agentPreset: standard`**（下面的默认值）。
            #     这是有意的：standard 是 DSH 通用内置模式，任何项目都有，不是本项目专用。
            #   · 想按能力选模式，走 `subagent_preset`（blackpig-roster 注册的**唯一**
            #     跨模式派活入口）—— 那条路径**没有任何名单**，装什么模式就能派什么。
            #   · 宿主校验：`allowedAgentPresets === undefined` 时 `SubagentPresetSelection`
            #     构造函数直接 return（源码实证），**不会**再抛
            #     "agentPreset must be included in allowedAgentPresets"。
            #
            # 为什么必须删（用户要求「通用化」）：原白名单是 standard / blender-worker /
            # video-reviewer，后两个是本项目的私有 preset（2026-11-02 已整块删除）；
            # 2026-11-03 脱敏时把私有名替换成了 example-worker / example-reviewer 这两个
            # 占位符（它们不是任何真实 preset 的 id）。别的项目装上黑猪模式时，私有名与
            # 占位符都不该出现在白名单里；而白名单本身是「默认禁止」—— 新装的模式既进不了
            # 枚举，又得回来改配置。
            # 删掉后：`subagent` 固定 standard（够用），跨模式派活全走 `subagent_preset`。
        - id: tool-subagent-fork
          name: "@deepseek-ai/dsh-tool-subagent"
          config:
            provider: fork
            toolName: subagent_fork
        # ── ★ 委派控制工具（2026-11-12 加，DSH 0.2.2-rc.2 适配）──
        #
        # 为什么必须自己挂（rc.1 不需要、rc.2 需要）：
        #   rc.1 的 dsh-experimental-agent-team-profile bundle 在全局层禁用
        #   tool-subagent*，再由 dsh-experimental-tool-agent-team **一个包提供全部
        #   9 个团队工具**（spawn_teammate / send_message / list_agents / wait_agent /
        #   interrupt_agent / team_task_*）。黑猪 preset 不挂任何工具，靠宿主注入也能拿到。
        #   rc.2 用 RETIRED_BUNDLES 退役了那个 bundle，把工具拆成两个插件：
        #     · dsh-tool-agent-team      → team_task_*（仍由 base 全局挂，受 Team 开关控制）
        #     · dsh-tool-subagent-control → send_message / list_agents / wait_agent /
        #                                   interrupt_agent（改为**各 preset 自己声明**）
        #   standard.patch.yml 声明了这一行，黑猪没声明 → 升级后这 4 个工具消失。
        #   实测：升级前 9 个团队工具全在（会话 session-9c414a0f 等 24 工具），
        #        升级后 0 个。详见 docs/blackpig-rc2-team-tools-regression.md。
        #
        # 通用性：本行不含任何第三方/项目私有引用，只声明宿主自带的公开插件；
        #   inject 只有 tools/subagents/agents/systemPrompt 四个通用服务，
        #   不违反「不写死任何第三方工具名」那条红线。
        #
        # 成本（实测）：4 个工具定义共 1,702 B ≈ 530 token，**与 Team 开关无关、常驻**
        #   （它的 apply() 无条件注册，不读 agentTeams.isEnabled）。
        #
        # interrupt: true —— 黑猪人格里写了 interrupt_agent 的用法（按队友名打断），
        #   打通它才不留死文本。不想要可改 false（省约 514 B）。
        - id: tool-subagent-control
          name: "@deepseek-ai/dsh-tool-subagent-control"
          config:
            interrupt: true
        - id: present
          name: "@deepseek-ai/dsh-tool-present"
        # ── ★ 跨模式派活 + 名册（2026-10-31）──
        #
        # ⚠️ 2026-11-02 更正：**这个顺序其实无关紧要**（下面这段旧注释描述的是
        #   一个已经不存在的机制，按红线 6 改成实话）。
        #
        # 旧注释说「guard 的 keep 过滤用的是它初始化时持有的 available 快照
        # （`if (keep.has(name) && !available.has(name))` 移除），排在后面会被静默剔掉」。
        # 实测：guard 里**已经没有** `keep.delete()` —— 那套破坏性剪枝在 2026-11-01
        # 就被删掉了（`pruneAbsentTeamTools()` 现在只**返回列表用于日志**，不改 keep，
        # 见 guard 里那段「只观察、不改 keep」的注释）。而且 `subagent_preset` 本来就在
        # `DEFAULT_KEEP` 里，不依赖 `config.keep`；运行时 deny 来自实时的
        # `fullToolNames()`，roster 注册会触发 `tools/change` → 重算。
        #
        # 所以：保持当前顺序**无害**（R-3 测试还锁着它），但别再把这条当成
        # 「必须遵守的机制」——它是历史遗留的保险，不是功能依赖。
        #
        # 实测背景（这条仍然有效）：扫大量会话日志，协调者**从未**在派活时传过
        # `agent_preset`。不传就落到 `agentPreset:"standard"`，而 standard 没有项目
        # 专用模式的工具，派过去必然白烧一轮，且不报错。
        # 本工具把「用哪个模式」变成必填参数，并给出按能力挑选的名册。
        - id: blackpig-roster
          name: "dsh-blackpig-mode/blackpig-roster.mjs"
          config:
            enabled: true
            selfPresetId: blackpigmodel
            # ── 2026-11-02 通用化：人工边界（白名单/黑名单）**全部删除** ──
            #
            # 原配置有两层名单：
            #   allowedPresets（白名单，10-31 建）
            #   deniedPresets（黑名单，11-02 短暂存在过）
            # 两者都已删除。理由（用户定的设计原则）：
            #   ① 模式是可独立安装的组件，黑猪模式不该替运维记「哪些模式允许被派」；
            #   ② 名册已列出每个模式的能力，选人是**能力问题**，不是名单问题；
            #   ③ 每加一个新模式就要改黑猪配置 ⇒ 模式不可通用。
            #
            # 危险模式（能改部署本体的）由**能力标签**暴露（harness-dev / plugin-admin /
            # plugin-market，见 roster 的 DEFAULT_CAPABILITY_HINTS）；选人方自己判断。
            # 这与 dsh-multitask 的 preset-dispatch 做法一致（那个模块也没有任何名单）。
            #
            # ── 2026-11-02：`capabilityHints` 也不写在这里 ──
            #
            # 这个可选配置用来把**项目专用插件**的模块名映射成能力词。假设本项目装了
            # 两个专用插件（下称 `dsh-a-plugin` / `dsh-b-plugin`，仅作示例名），理论上可以写：
            #
            #     capabilityHints:
            #       dsh-a-plugin: A_CAPABILITY
            #       dsh-b-plugin: B_CAPABILITY
            #
            # 但用户判定这仍然属于「项目私有知识」，不该出现在黑猪模式的配置里 ——
            # 黑猪模式的配置段只放**模式自己的开关**（enabled / selfPresetId）。
            #
            # 不写的后果（已实测）：这两个模式在名册里显示为 `?a-plugin` / `?b-plugin` ——
            # 能力标签变成"存在但没映射过"的原始模块名。功能一点不丢：`ask: true` 能问出
            # 它实际能调的工具，`detail: true` 能读完整声明。这正是那两步阶梯存在的意义。
            #
            # 若将来某个项目确实想让名册直接显示好词，**由该项目自己的工作区/运维层**
            # 提供 capabilityHints（黑猪 core 支持这个口子，但默认不配）。
            # ── ★ 大脑收窄（只在大脑自己的 scope 上装）──
        - id: blackpig-guard
          name: "dsh-blackpig-mode/guard-v10.mjs"
          config:
            enabled: true
            presetId: blackpigmodel
            # 保留集追加：本部署要额外放行的工具。
            #
            # 背景（2026-11-03 发布通用化）：这张表**曾经**写死记忆插件的 17 个工具名
            # （mnemon_*，先在 guard-v10.mjs 的 DEFAULT_KEEP 里，后挪到这里）。两种都不对：
            #   · 别的部署没装那个插件 —— 那些行永不命中，纯污染；
            #   · 别的部署装了**另一个**插件 —— 名字全不一样，工具进不了保留集，
            #     而宿主仍会**无条件**注入记忆协议 —— "付了钱没有能力"的 bug 重现。
            #
            # 结论：本包**不写死任何第三方工具名**，只写与部署无关的通用名。
            # 要让大脑持有某个第三方工具，由部署自己把**精确工具名**加进下面这张表
            # （精确名字匹配，不支持通配）。注意：表一旦改动就要自己维护，且 profile 侧
            # 覆盖 preset config 是**整体替换不是合并**。
            #
            # 名字必须与 `blackpig-roster.mjs` 的 `export const TOOL_NAME` 逐字一致。
            keep:
              - subagent_preset
              # ── 第三方工具名已全部移除（2026-11-03，发布通用化）──
              # 本包不写死任何第三方工具名（例如记忆插件的 mnemon_* 17 个）。
              # 要让大脑持有某个第三方工具：把精确工具名加进本表（不支持通配）。
              # ── 团队协作工具（spawn_teammate / wait_agent / team_task_*）已在
              #   DEFAULT_KEEP 里，无需在此重复；本表只列本部署要额外放行的
              #   工具。团队插件关掉时这些名字本来就不存在，见 guard-v10.mjs
              #   的 DEFAULT_KEEP 名单。
              # ── 切流（2026-10-31，阶段 2）──
              #
              # 把旧的派活路径关掉，只留 `subagent_preset` 一条。
              #
              # 为什么必须关（这是本方案的核心，不是优化）：
              #   实测扫大量会话日志，协调者**从未**在派活时传过 `agent_preset`。
              #   根因不是模型懒，是「不传也能成功」—— 旧 `subagent` 永远回落到
              #   `agentPreset: "standard"`。派项目专用模式的活过去，standard 没有
              #   项目专用工具面，代理干不了，白烧一轮，
              #   **而且不报错**。留着旧路径，新工具就是摆设。
              #
              # 为什么 `subagent_fork` 也关：
              #   它的 provider 是 `fork`，宿主明确不支持在 fork 上选 preset
              #   （`does not support independent agent preset selection`）。
              #   即它**永远**无法满足「选模式」这个要求，留着就是留一条无法强制的路径。
              #   大脑要复用上下文，用 `send_to_subagent` 接着跟已派出的代理说话即可 ——
              #   复用的是**代理自己的**上下文，比 fork 继承大脑的对话更精准。
              #
              # 作用域已验证安全：guard 只装在 blackpigmodel 这一个 preset 里，
              # 且 `sync()` 对子会话直接 `release()` 早退、对 owner 不符的会话也 release。
              # 所以这两行只影响大脑自己，不影响任何代理、不影响其他模式。
              #
              # 回滚：删掉这两行即可恢复旧路径（不需要动任何代码）。
            extraDeny:
              - subagent
              - subagent_fork
        - id: blackpig-subtalk
          name: "dsh-blackpig-mode/subtalk.mjs"
          config:
            enabled: true
            interruptBeforeSend: true
